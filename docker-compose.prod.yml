# ===== 生产环境：MySQL 8 + Spring Boot 后端 =====
# 用法：
#   1. 修改 .env 中的 DB_PASSWORD
#   2. 首次启动（自动建库，不拉外网镜像）：
#        docker compose up -d --build
#   3. 后续重启：
#        docker compose pull backend && docker compose up -d backend
# ================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: training-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: training
      TZ: Asia/Shanghai
    volumes:
      # 数据持久化
      - ./mysql-data:/var/lib/mysql
      # 时区同步（宿主机必须存在 /etc/timezone 和 /etc/localtime）
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # 初始化 SQL（首次启动自动执行 schema.sql + data.sql，可按需挂载）
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    ports:
      # 只绑定到 127.0.0.1，禁止外网直接访问
      - "127.0.0.1:3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=512M
      --slow-query-log=ON
      --long-query-time=2
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${DB_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: training-backend:latest
    container_name: training-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql          # 容器间网络，直接用服务名
      - DB_PORT=3306
      - DB_NAME=training
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=8080
      - JAVA_OPTS=${JAVA_OPTS:--Xms512m -Xmx1024m}
      # 生产需要严格限制跨域，可在这里覆盖
      # - CORS_ALLOWED_ORIGINS=https://your-domain.com
    volumes:
      - ./logs:/app/logs
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8080:8080"
    # 如果后端挂了自动重启
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/v3/api-docs || curl -f http://127.0.0.1:8080/api/v1/auth/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
