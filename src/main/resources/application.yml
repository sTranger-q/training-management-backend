# ===== 公共配置（所有环境共享） =====
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: training-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 跨域配置（可被配置中心覆盖）
cors:
  allowed-origins: "*"
