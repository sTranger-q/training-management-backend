server:
  port: 8080

spring:
  application:
    name: training-backend
  datasource:
    # H2 内存库，开箱即用；生产请替换为 MySQL: jdbc:mysql://host:3306/training?useSSL=false&serverTimezone=Asia/Shanghai
    url: jdbc:h2:mem:training;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.training.system: debug
