# ==============================================================
# GitHub Actions 流水线
# 触发条件：
#   1) 手动触发 (Actions → Run workflow)
#   2) push 到 main 分支
#
# 工作流程：
#   - 检出代码 → Maven 构建 → 打 Docker 镜像 → SSH 到服务器 → 拉镜像重启
#
# 仓库 Settings → Secrets and variables → Actions 需配置以下 Secrets：
#   SERVER_HOST      : 服务器公网 IP
#   SERVER_PORT      : SSH 端口，默认 22
#   SERVER_USER      : SSH 用户名，如 root
#   SERVER_SSH_KEY   : SSH 私钥（id_rsa 内容，不含密码）
#   DB_PASSWORD      : MySQL 生产密码
# ==============================================================

name: Build & Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: /opt/training-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 缓存 Maven 依赖
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 构建（跳过测试）
      - name: Build with Maven
        run: mvn clean package -DskipTests -B -q

      # 4. 登录 GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. 提取 Docker 元数据
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # 6. 构建 Docker 镜像并推送
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 7. SSH 到服务器，拉镜像 + docker compose 重启
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p $APP_DIR $APP_DIR/logs $APP_DIR/mysql-data
            cd $APP_DIR

            # --- 写入 docker-compose.yml ---
            cat > docker-compose.yml <<'COMPOSE_EOF'
            services:
              mysql:
                image: mysql:8.0
                container_name: training-mysql
                restart: unless-stopped
                environment:
                  MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
                  MYSQL_DATABASE: training
                  TZ: Asia/Shanghai
                volumes:
                  - ./mysql-data:/var/lib/mysql
                  - /etc/timezone:/etc/timezone:ro
                  - /etc/localtime:/etc/localtime:ro
                ports:
                  - "127.0.0.1:3306:3306"
                command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
                  interval: 5s
                  timeout: 3s
                  retries: 10

              backend:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: training-backend
                restart: unless-stopped
                depends_on:
                  mysql:
                    condition: service_healthy
                environment:
                  - TZ=Asia/Shanghai
                  - SPRING_PROFILES_ACTIVE=prod
                  - DB_HOST=mysql
                  - DB_PORT=3306
                  - DB_NAME=training
                  - DB_USERNAME=root
                  - DB_PASSWORD=${DB_PASSWORD}
                  - JAVA_OPTS=-Xms512m -Xmx1024m
                volumes:
                  - ./logs:/app/logs
                  - /etc/timezone:/etc/timezone:ro
                  - /etc/localtime:/etc/localtime:ro
                ports:
                  - "8080:8080"
                pull_policy: always
            COMPOSE_EOF

            # --- 写入 .env ---
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env

            # --- 登录 GHCR ---
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # --- 首次启动：自动建表 ---
            if [ ! -f .db-initialized ]; then
              export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
              docker compose up -d mysql
              for i in $(seq 1 60); do
                docker exec training-mysql mysqladmin ping -uroot -p"$DB_PASSWORD" >/dev/null 2>&1 && break
                sleep 2
              done
              touch .db-initialized
            fi

            # --- 重启后端 ---
            docker compose pull backend
            docker compose up -d backend

            # --- 清理旧镜像 ---
            docker image prune -af || true

      # 8. 健康检查（冒烟测试）
      - name: Smoke test
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SERVER_HOST }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/v3/api-docs || true)
              if [ "$code" = "200" ] || [ "$code" = "404" ]; then
                echo "✅ 服务健康，HTTP=$code"
                exit 0
              fi
              sleep 2
            done
            echo "❌ 服务未就绪，查看 docker logs training-backend"
            docker logs --tail 50 training-backend 2>&1 || true
            exit 1
